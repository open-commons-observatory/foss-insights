# Project configuration. Copy this template, then edit these values.
name: foss-insights-template          # short name; also names the local data directory
title: "FOSS Insights template"       # site title
tagline: "An evidence-backed, versioned map of a project's problems."
repo: open-commons-observatory/foss-insights   # GitHub repo that stores the database (in refs/dolt/data)
source:
  repo: example/project           # the project being analysed (owner/name)
  maintainers: []                 # logins whose comments are marked M when reading threads
database: fi                      # database name inside Doltgres
taxonomy: taxonomy.yaml           # the controlled vocabulary
pie_facet: pr_potential           # facet drawn as a chart on the index page (optional)
required_facets: [kind, conf]     # `fi check` warns when an analysed item lacks these
doltgres_version: v1.3.3
