name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Playbook self-check
        run: python tools/check-playbook.py
      - name: Reference implementation still validates
        run: cd reference-implementation && python tools/pz.py validate && python -c "import ast,sys; [ast.parse(open(f).read()) for f in ('tools/pz.py','tools/threads.py')]"
      - name: Offline regression tests of the reference implementation
        run: python reference-implementation/tests/test_reference.py
